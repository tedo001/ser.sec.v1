{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block page_title %}System Settings{% endblock %}

{% block content %}
<div class="settings-layout">

  <!-- ── YAML editor ────────────────────────────────────────────────── -->
  <div class="settings-editor-card">
    <div class="card-head">
      <span class="card-title">config.yaml</span>
      <div class="head-actions">
        <button class="btn-sm btn-save" onclick="saveConfig()">Save &amp; Restart</button>
        <button class="btn-sm"          onclick="resetEditor()">Reset</button>
      </div>
    </div>
    <textarea id="cfg-editor" class="yaml-editor" spellcheck="false">{{ config_yaml }}</textarea>
    <div id="cfg-msg" class="cfg-msg"></div>
  </div>

  <!-- ── Quick-edit cards ───────────────────────────────────────────── -->
  <div class="quick-settings">

    <div class="qs-card">
      <h3>Source</h3>
      <label>Input (path / index / RTSP)</label>
      <input id="qs-source" class="qs-input" type="text"
             value="{{ cfg.source.input }}" />
      <label>Force night mode</label>
      <select id="qs-force-night" class="qs-select">
        <option value="false" {% if not cfg.source.force_night %}selected{% endif %}>No</option>
        <option value="true"  {% if cfg.source.force_night %}selected{% endif %}>Yes</option>
      </select>
    </div>

    <div class="qs-card">
      <h3>Model</h3>
      <label>Device</label>
      <select id="qs-device" class="qs-select">
        {% for d in ['cpu','cuda','mps'] %}
        <option value="{{ d }}" {% if cfg.model.device == d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>
      <label>Image size</label>
      <select id="qs-imgsz" class="qs-select">
        {% for s in [320, 416, 640] %}
        <option value="{{ s }}" {% if cfg.model.imgsz == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
      <label>Confidence</label>
      <input id="qs-conf" class="qs-input" type="number" step="0.05"
             min="0.1" max="0.95" value="{{ cfg.model.conf_threshold }}" />
    </div>

    <div class="qs-card">
      <h3>Risk Thresholds</h3>
      <label>Night threshold</label>
      <input id="qs-thr-night" class="qs-input" type="number" step="0.05"
             min="0" max="1.5" value="{{ cfg.risk.threshold_night }}" />
      <label>Day threshold</label>
      <input id="qs-thr-day" class="qs-input" type="number" step="0.05"
             min="0" max="1.5" value="{{ cfg.risk.threshold_day }}" />
      <label>Loiter seconds</label>
      <input id="qs-loiter" class="qs-input" type="number" step="1"
             min="2" max="120" value="{{ cfg.risk.loiter_seconds }}" />
    </div>

    <div class="qs-card">
      <h3>Alerts</h3>
      <label>Cooldown (seconds)</label>
      <input id="qs-cooldown" class="qs-input" type="number" step="1"
             min="1" max="300" value="{{ cfg.alert.cooldown_seconds }}" />
      <label>Beep on alert</label>
      <select id="qs-beep" class="qs-select">
        <option value="true"  {% if cfg.alert.beep %}selected{% endif %}>Yes</option>
        <option value="false" {% if not cfg.alert.beep %}selected{% endif %}>No</option>
      </select>
    </div>

    <button class="btn-save btn-wide" onclick="applyQuick()">
      Apply Quick Settings &amp; Restart
    </button>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
const origYaml = document.getElementById("cfg-editor").value;

function resetEditor() {
  document.getElementById("cfg-editor").value = origYaml;
  setMsg("", "");
}

function setMsg(text, type) {
  const el = document.getElementById("cfg-msg");
  el.textContent = text;
  el.className = "cfg-msg " + (type === "ok" ? "msg-ok" : type === "err" ? "msg-err" : "");
}

async function saveConfig() {
  const yaml = document.getElementById("cfg-editor").value;
  setMsg("Saving…", "");
  const r = await fetch("/api/config", {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: yaml,
  });
  const j = await r.json();
  if (j.ok) setMsg("Saved — pipeline restarted.", "ok");
  else       setMsg("Error: " + (j.error || "unknown"), "err");
}

// --- Quick-settings apply: fetch YAML, patch the relevant keys, re-POST ---
async function applyQuick() {
  const r   = await fetch("/api/config");
  const cfg = await r.json();

  cfg.source.input        = document.getElementById("qs-source").value;
  cfg.source.force_night  = document.getElementById("qs-force-night").value === "true";
  cfg.model.device        = document.getElementById("qs-device").value;
  cfg.model.imgsz         = parseInt(document.getElementById("qs-imgsz").value);
  cfg.model.conf_threshold = parseFloat(document.getElementById("qs-conf").value);
  cfg.risk.threshold_night = parseFloat(document.getElementById("qs-thr-night").value);
  cfg.risk.threshold_day   = parseFloat(document.getElementById("qs-thr-day").value);
  cfg.risk.loiter_seconds  = parseFloat(document.getElementById("qs-loiter").value);
  cfg.alert.cooldown_seconds = parseFloat(document.getElementById("qs-cooldown").value);
  cfg.alert.beep           = document.getElementById("qs-beep").value === "true";

  // Convert to YAML manually via a simple JSON→YAML shim (no external dep)
  const yamlStr = jsonToYaml(cfg);
  document.getElementById("cfg-editor").value = yamlStr;
  await saveConfig();
}

// Minimal JSON→YAML for flat / two-level objects
function jsonToYaml(obj, indent = 0) {
  const pad = "  ".repeat(indent);
  let out = "";
  for (const [k, v] of Object.entries(obj)) {
    if (v !== null && typeof v === "object" && !Array.isArray(v)) {
      out += `${pad}${k}:\n` + jsonToYaml(v, indent + 1);
    } else if (Array.isArray(v)) {
      out += `${pad}${k}:\n`;
      v.forEach(item => { out += `${pad}  - ${item}\n`; });
    } else {
      const val = typeof v === "string" && v.includes(" ") ? `"${v}"` : v;
      out += `${pad}${k}: ${val}\n`;
    }
  }
  return out;
}
</script>
{% endblock %}
